ServerName localhost
ServerTokens Prod
ServerSignature Off

# Asset Vite punya hash di nama file, aman di-cache lama
<Directory /var/www/html/public/build>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>

<Directory /var/www/html/public/storage>
    ExpiresActive On
    ExpiresDefault "access plus 7 days"
</Directory>
