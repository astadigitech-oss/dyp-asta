# Deploy dyp-app di Dokploy (tipe: Docker Compose).
# Isi variabel di tab "Environment" Dokploy, lalu atur domain di tab "Domains" (service: app, port: 80).
# Database dan API dyp-admin berada di luar compose ini.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: "${APP_NAME:-PT Dian Yogya Perdana}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      APP_LOCALE: "${APP_LOCALE:-en}"

      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-warning}"

      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-dypdb}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local

      ADMIN_API_URL: "${ADMIN_API_URL}"
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN}"
      ADMIN_API_CACHE_TTL: "${ADMIN_API_CACHE_TTL:-600}"
      ADMIN_API_TIMEOUT: "${ADMIN_API_TIMEOUT:-5}"

      COMPANY_LINKEDIN_URL: "${COMPANY_LINKEDIN_URL:-}"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
